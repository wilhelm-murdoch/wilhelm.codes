<blockquote
  class="not-prose my-15 text-center leading-relaxed text-slate-800 sm:text-2xl md:text-4xl"
>
  {{ safe.HTML (index .Params 0) }}
  {{ if (index .Params 1) }}
    <cite class="block pt-4 text-center text-sm text-slate-400"
      >{{ index .Params 1 }}</cite
    >
  {{ end }}
</blockquote>
